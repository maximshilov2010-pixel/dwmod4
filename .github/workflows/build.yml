name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project zip
        run: |
          ls -la
          mkdir -p ../proj
          unzip -q -o ./*.zip -d ../proj
          find ../proj -maxdepth 2 -name gradlew
      - name: Build
        run: |
          cd "$(dirname "$(find ../proj -maxdepth 2 -name gradlew | head -1)")"
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: dystopianwars-mod
          path: out/*.jar
